<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Foko Inventory</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap');
        
        body { 
            font-family: 'Sarabun', sans-serif; 
            background: linear-gradient(135deg, #090B14 0%, #0F172A 50%, #020617 100%);
            background-attachment: fixed;
            color: #e2e8f0;
        }

        .glass-panel {
            background: rgba(15, 23, 42, 0.6);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(56, 189, 248, 0.15);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }

        .glass-header {
            background: rgba(9, 11, 20, 0.8);
            backdrop-filter: blur(16px);
            border-bottom: 1px solid rgba(56, 189, 248, 0.2);
        }

        .tab-active { 
            background: rgba(56, 189, 248, 0.15); 
            color: #38bdf8; 
            border: 1px solid rgba(56, 189, 248, 0.5);
            box-shadow: 0 0 10px rgba(56, 189, 248, 0.2);
            border-radius: 9999px; 
        }
        .tab-inactive { 
            background: rgba(30, 41, 59, 0.5); 
            color: #94a3b8; 
            border: 1px solid transparent;
            border-radius: 9999px; 
            transition: all 0.3s ease;
        }
        .tab-inactive:hover {
            background: rgba(30, 41, 59, 0.8);
            color: #e2e8f0;
            border: 1px solid rgba(148, 163, 184, 0.3);
        }

        .item-card { 
            background-size: cover; 
            background-position: center; 
            position: relative; 
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            border: 1px solid rgba(255, 255, 255, 0.05);
            background-color: #1e293b;
        }
        .item-card:hover {
            transform: translateY(-5px) scale(1.02);
            box-shadow: 0 10px 25px rgba(56, 189, 248, 0.3);
            border-color: rgba(56, 189, 248, 0.5);
            z-index: 10;
        }
        .item-overlay { 
            background: linear-gradient(to top, rgba(2, 6, 23, 0.95) 0%, rgba(15, 23, 42, 0.7) 40%, rgba(15, 23, 42, 0.2) 100%); 
        }
        
        .low-stock { 
            border: 1px solid #ef4444; 
            box-shadow: 0 0 15px rgba(239, 68, 68, 0.4);
            animation: pulse-red 2s infinite;
        }
        @keyframes pulse-red {
            0% { box-shadow: 0 0 10px rgba(239, 68, 68, 0.3); }
            50% { box-shadow: 0 0 20px rgba(239, 68, 68, 0.6); }
            100% { box-shadow: 0 0 10px rgba(239, 68, 68, 0.3); }
        }

        .qty-btn {
            background: rgba(30, 41, 59, 0.8);
            color: #cbd5e1;
            border: 1px solid rgba(255,255,255,0.1);
            transition: all 0.2s;
        }
        .qty-btn:hover { background: #38bdf8; color: #fff; border-color: #38bdf8; box-shadow: 0 0 10px rgba(56,189,248,0.5); }
        
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(56, 189, 248, 0.3); border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(56, 189, 248, 0.6); }
        
        .swal2-popup { background: #0f172a !important; border: 1px solid rgba(56, 189, 248, 0.3) !important; color: #f8fafc !important; box-shadow: 0 0 30px rgba(0,0,0,0.8) !important; border-radius: 1rem !important; }
        .swal2-title, .swal2-html-container { color: #f8fafc !important; }
        .swal2-input, .swal2-select { background: #1e293b !important; border: 1px solid #334155 !important; color: #f8fafc !important; }
        .swal2-input:focus, .swal2-select:focus { border-color: #38bdf8 !important; box-shadow: 0 0 0 2px rgba(56, 189, 248, 0.2) !important; }
        
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        .text-neon { text-shadow: 0 0 10px rgba(56, 189, 248, 0.6); }
    </style>
</head>
<body class="antialiased selection:bg-cyan-500 selection:text-white min-h-screen pb-20">

    <header class="sticky top-0 z-40 glass-header px-4 py-3 mb-6">
        <div class="max-w-7xl mx-auto flex justify-between items-center">
            <div class="flex items-center space-x-3">
                <div class="w-9 h-9 rounded-xl bg-cyan-500/20 border border-cyan-400/30 flex items-center justify-center text-cyan-400">
                    <i class="fas fa-box-open text-lg"></i>
                </div>
                <div>
                    <h1 id="headerTitle" class="font-bold text-lg tracking-wide text-white leading-tight">FOKO SYSTEM</h1>
                    <span class="text-[10px] uppercase tracking-widest text-cyan-400 font-semibold flex items-center gap-1">
                        <span class="w-1.5 h-1.5 rounded-full bg-cyan-400 animate-pulse"></span> ONLINE
                    </span>
                </div>
            </div>
            <div class="flex items-center space-x-2">
                <button id="btnInventory" onclick="window.switchMode('inventory')" class="px-3 py-1.5 rounded-lg text-xs font-semibold border transition-all bg-cyan-500/20 text-cyan-400 border-cyan-500/50 shadow-[0_0_10px_rgba(56,189,248,0.3)]">
                    <i class="fas fa-boxes-stacked mr-1"></i> INVENTORY
                </button>
                <button id="btnCompare" onclick="window.switchMode('compare')" class="px-3 py-1.5 rounded-lg text-xs font-semibold border transition-all text-slate-400 border-transparent hover:text-cyan-400">
                    <i class="fas fa-store mr-1"></i> MARKET
                </button>
            </div>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-4">
        <div id="inventoryView">
            <div id="categoryTabs" class="flex space-x-2 overflow-x-auto hide-scrollbar pb-4 mb-4"></div>
            <div id="itemGrid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-4"></div>
        </div>

        <div id="compareView" class="hidden">
            <div id="compareGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4"></div>
        </div>
    </main>

    <!-- ปุ่ม + มุมขวาล่าง -->
    <button onclick="window.addNewProductModal()" class="fixed bottom-6 right-6 w-14 h-14 bg-cyan-500 text-slate-950 font-bold rounded-full shadow-[0_0_20px_rgba(56,189,248,0.5)] border border-cyan-300 flex items-center justify-center text-2xl hover:scale-110 active:scale-95 transition-all z-40">
        <i class="fas fa-plus"></i>
    </button>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
    import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
    import { getFirestore, collection, addDoc, onSnapshot, query, updateDoc, doc, deleteDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyBZcd0WjZ5pL76WXPeqwXr_2AIvQgDRUJ0",
        authDomain: "foko-inventory.firebaseapp.com",
        projectId: "foko-inventory",
        storageBucket: "foko-inventory.firebasestorage.app",
        messagingSenderId: "1000232794009",
        appId: "1:1000232794009:web:6c7b087d09215131710508",
        measurementId: "G-SNN69RWKR4"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const auth = getAuth(app);
    const userId = "shared_foko_user"; 
    const appId = firebaseConfig.appId;

    let categories = ["รวมสินค้าทั้งหมด", "บิงซู", "ทาโกะยากิ", "ข้าวโพดคลุกเนย", "น้ำอัดลม", "ของทั่วไป"];

    const state = {
        items: [],
        compareItems: [],
        currentCategory: "รวมสินค้าทั้งหมด",
        mode: 'inventory'
    };

    async function init() {
        try {
            await signInAnonymously(auth);
            setupRealtimeListeners();
            renderTabs();
        } catch (error) {
            console.error("Auth error:", error);
            Swal.fire('Error', 'ไม่สามารถเชื่อมต่อฐานข้อมูลได้', 'error');
        }
    }

    function setupRealtimeListeners() {
        const itemsRef = collection(db, 'artifacts', appId, 'users', userId, 'inventory');
        onSnapshot(query(itemsRef), (snapshot) => {
            state.items = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
            render();
        });

        const compareRef = collection(db, 'artifacts', appId, 'users', userId, 'compare');
        onSnapshot(query(compareRef), (snapshot) => {
            state.compareItems = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
            if (state.mode === 'compare') renderCompare();
        });

        const catRef = collection(db, 'artifacts', appId, 'users', userId, 'categories');
        onSnapshot(query(catRef), (snapshot) => {
             const customCats = snapshot.docs.map(doc => doc.data().name);
             categories = ["รวมสินค้าทั้งหมด", "บิงซู", "ทาโกะยากิ", "ข้าวโพดคลุกเนย", "น้ำอัดลม", "ของทั่วไป", ...customCats];
             renderTabs();
        });
    }

    window.switchMode = async function(mode) {
        if (mode === 'compare' && state.mode !== 'compare') {
            const { value: password } = await Swal.fire({
                title: 'SYSTEM SECURITY',
                text: 'กรุณาใส่รหัสผ่านเพื่อเข้าถึงข้อมูล',
                input: 'password',
                inputPlaceholder: '••••',
                background: '#0f172a',
                color: '#f8fafc',
                confirmButtonColor: '#0ea5e9',
                confirmButtonText: 'UNLOCK',
                showCancelButton: true
            });

            if (password !== '9095') {
                if (password !== undefined) {
                    Swal.fire({ title: 'ACCESS DENIED', text: 'รหัสผ่านไม่ถูกต้อง!', icon: 'error' });
                }
                return;
            }
        }

        state.mode = mode;
        const invBtn = document.getElementById('btnInventory');
        const cmpBtn = document.getElementById('btnCompare');

        if (mode === 'inventory') {
            document.getElementById('inventoryView').classList.remove('hidden');
            document.getElementById('compareView').classList.add('hidden');
            document.getElementById('headerTitle').innerText = 'FOKO SYSTEM';
            
            invBtn.className = "px-3 py-1.5 rounded-lg text-xs font-semibold border transition-all bg-cyan-500/20 text-cyan-400 border-cyan-500/50 shadow-[0_0_10px_rgba(56,189,248,0.3)]";
            cmpBtn.className = "px-3 py-1.5 rounded-lg text-xs font-semibold border transition-all text-slate-400 border-transparent hover:text-cyan-400";
            render();
        } else {
            document.getElementById('inventoryView').classList.add('hidden');
            document.getElementById('compareView').classList.remove('hidden');
            document.getElementById('headerTitle').innerText = 'เปรียบเทียบราคา';
            
            cmpBtn.className = "px-3 py-1.5 rounded-lg text-xs font-semibold border

<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Foko Inventory</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap');
        
        body { 
            font-family: 'Sarabun', sans-serif; 
            background: linear-gradient(135deg, #090B14 0%, #0F172A 50%, #020617 100%);
            background-attachment: fixed;
            color: #e2e8f0;
            user-select: none; /* ป้องกันการคลุมดำตอนดับเบิ้ลคลิก */
        }

        .glass-panel {
            background: rgba(15, 23, 42, 0.6);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(56, 189, 248, 0.15);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }

        .glass-header {
            background: rgba(9, 11, 20, 0.8);
            backdrop-filter: blur(16px);
            border-bottom: 1px solid rgba(56, 189, 248, 0.2);
        }

        .tab-active { 
            background: rgba(56, 189, 248, 0.15); 
            color: #38bdf8; 
            border: 1px solid rgba(56, 189, 248, 0.5);
            box-shadow: 0 0 10px rgba(56, 189, 248, 0.2);
            border-radius: 9999px; 
        }
        .tab-inactive { 
            background: rgba(30, 41, 59, 0.5); 
            color: #94a3b8; 
            border: 1px solid transparent;
            border-radius: 9999px; 
            transition: all 0.3s ease;
        }
        .tab-inactive:hover {
            background: rgba(30, 41, 59, 0.8);
            color: #e2e8f0;
            border: 1px solid rgba(148, 163, 184, 0.3);
        }

        .item-card { 
            background-size: cover; 
            background-position: center; 
            position: relative; 
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            border: 1px solid rgba(255, 255, 255, 0.05);
            background-color: #1e293b;
            cursor: pointer;
        }
        .item-card:hover {
            transform: translateY(-5px) scale(1.02);
            box-shadow: 0 10px 25px rgba(56, 189, 248, 0.3);
            border-color: rgba(56, 189, 248, 0.5);
            z-index: 10;
        }
        .item-overlay { 
            background: linear-gradient(to top, rgba(2, 6, 23, 0.95) 0%, rgba(15, 23, 42, 0.7) 40%, rgba(15, 23, 42, 0.2) 100%); 
        }
        
        .low-stock { 
            border: 1px solid #ef4444; 
            box-shadow: 0 0 15px rgba(239, 68, 68, 0.4);
            animation: pulse-red 2s infinite;
        }
        @keyframes pulse-red {
            0% { box-shadow: 0 0 10px rgba(239, 68, 68, 0.3); }
            50% { box-shadow: 0 0 20px rgba(239, 68, 68, 0.6); }
            100% { box-shadow: 0 0 10px rgba(239, 68, 68, 0.3); }
        }

        .qty-btn {
            background: rgba(30, 41, 59, 0.8);
            color: #cbd5e1;
            border: 1px solid rgba(255,255,255,0.1);
            transition: all 0.2s;
        }
        .qty-btn:hover { background: #38bdf8; color: #fff; border-color: #38bdf8; box-shadow: 0 0 10px rgba(56,189,248,0.5); }
        
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(56, 189, 248, 0.3); border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(56, 189, 248, 0.6); }
        
        .swal2-popup { background: #0f172a !important; border: 1px solid rgba(56, 189, 248, 0.3) !important; color: #f8fafc !important; box-shadow: 0 0 30px rgba(0,0,0,0.8) !important; border-radius: 1rem !important; }
        .swal2-title, .swal2-html-container { color: #f8fafc !important; }
        .swal2-input, .swal2-select { background: #1e293b !important; border: 1px solid #334155 !important; color: #f8fafc !important; }
        .swal2-input:focus, .swal2-select:focus { border-color: #38bdf8 !important; box-shadow: 0 0 0 2px rgba(56, 189, 248, 0.2) !important; }
        
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="antialiased selection:bg-cyan-500 selection:text-white min-h-screen pb-20">

    <header class="sticky top-0 z-40 glass-header px-4 py-3 mb-6">
        <div class="max-w-7xl mx-auto flex justify-between items-center">
            <div class="flex items-center space-x-3">
                <div class="w-9 h-9 rounded-xl bg-cyan-500/20 border border-cyan-400/30 flex items-center justify-center text-cyan-400">
                    <i class="fas fa-box-open text-lg"></i>
                </div>
                <div>
                    <h1 id="headerTitle" class="font-bold text-lg tracking-wide text-white leading-tight">FOKO SYSTEM</h1>
                    <span class="text-[10px] uppercase tracking-widest text-cyan-400 font-semibold flex items-center gap-1">
                        <span class="w-1.5 h-1.5 rounded-full bg-cyan-400 animate-pulse"></span> ONLINE
                    </span>
                </div>
            </div>
            <div class="flex items-center space-x-2">
                <button id="btnInventory" onclick="window.switchMode('inventory')" class="px-3 py-1.5 rounded-lg text-xs font-semibold border transition-all bg-cyan-500/20 text-cyan-400 border-cyan-500/50 shadow-[0_0_10px_rgba(56,189,248,0.3)]">
                    <i class="fas fa-boxes-stacked mr-1"></i> INVENTORY
                </button>
                <button id="btnCompare" onclick="window.switchMode('compare')" class="px-3 py-1.5 rounded-lg text-xs font-semibold border transition-all text-slate-400 border-transparent hover:text-cyan-400">
                    <i class="fas fa-store mr-1"></i> MARKET
                </button>
            </div>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-4">
        <div id="inventoryView">
            <div id="categoryTabs" class="flex space-x-2 overflow-x-auto hide-scrollbar pb-4 mb-4"></div>
            <p class="text-xs text-slate-400 mb-4 text-center">💡 ดับเบิ้ลคลิกที่สินค้าเพื่อแก้ไขข้อมูล</p>
            <div id="itemGrid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-4"></div>
        </div>

        <div id="compareView" class="hidden">
            <div id="compareGrid" class="flex flex-col gap-6"></div>
        </div>
    </main>

    <button onclick="window.handleFabClick()" class="fixed bottom-6 right-6 w-14 h-14 bg-cyan-500 text-slate-950 font-bold rounded-full shadow-[0_0_20px_rgba(56,189,248,0.5)] border border-cyan-300 flex items-center justify-center text-2xl hover:scale-110 active:scale-95 transition-all z-40">
        <i class="fas fa-plus"></i>
    </button>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
    import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
    import { getFirestore, collection, addDoc, onSnapshot, query, updateDoc, doc, deleteDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyBZcd0WjZ5pL76WXPeqwXr_2AIvQgDRUJ0",
        authDomain: "foko-inventory.firebaseapp.com",
        projectId: "foko-inventory",
        storageBucket: "foko-inventory.firebasestorage.app",
        messagingSenderId: "1000232794009",
        appId: "1:1000232794009:web:6c7b087d09215131710508",
        measurementId: "G-SNN69RWKR4"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const auth = getAuth(app);
    const userId = "shared_foko_user"; 
    const appId = firebaseConfig.appId;

    let categories = ["รวมสินค้าทั้งหมด", "บิงซู", "ทาโกะยากิ", "ข้าวโพดคลุกเนย", "น้ำอัดลม", "ของทั่วไป"];

    const state = {
        items: [],
        compareItems: [],
        currentCategory: "รวมสินค้าทั้งหมด",
        mode: 'inventory'
    };

    async function init() {
        try {
            await signInAnonymously(auth);
            setupRealtimeListeners();
        } catch (error) {
            console.error("Auth error:", error);
            Swal.fire('Error', 'ไม่สามารถเชื่อมต่อฐานข้อมูลได้', 'error');
        }
    }

    function setupRealtimeListeners() {
        const itemsRef = collection(db, 'artifacts', appId, 'users', userId, 'inventory');
        onSnapshot(query(itemsRef), (snapshot) => {
            state.items = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
            render();
        });

        const compareRef = collection(db, 'artifacts', appId, 'users', userId, 'compare');
        onSnapshot(query(compareRef), (snapshot) => {
            state.compareItems = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
            if (state.mode === 'compare') renderCompare();
        });

        const catRef = collection(db, 'artifacts', appId, 'users', userId, 'categories');
        onSnapshot(query(catRef), (snapshot) => {
             const customCats = snapshot.docs.map(doc => doc.data().name);
             categories = ["รวมสินค้าทั้งหมด", "บิงซู", "ทาโกะยากิ", "ข้าวโพดคลุกเนย", "น้ำอัดลม", "ของทั่วไป", ...customCats];
             renderTabs();
        });
    }

    window.switchMode = async function(mode) {
        if (mode === 'compare' && state.mode !== 'compare') {
            const { value: password } = await Swal.fire({
                title: 'SYSTEM SECURITY',
                text: 'กรุณาใส่รหัสผ่านเพื่อเข้าถึงข้อมูล',
                input: 'password',
                inputPlaceholder: '••••',
                background: '#0f172a',
                color: '#f8fafc',
                confirmButtonColor: '#0ea5e9',
                confirmButtonText: 'UNLOCK',
                showCancelButton: true
            });

            if (password !== '9095') {
                if (password !== undefined) {
                    Swal.fire({ title: 'ACCESS DENIED', text: 'รหัสผ่านไม่ถูกต้อง!', icon: 'error' });
                }
                return;
            }
        }

        state.mode = mode;
        const invBtn = document.getElementById('btnInventory');
        const cmpBtn = document.getElementById('btnCompare');

        if (mode === 'inventory') {
            document.getElementById('inventoryView').classList.remove('hidden');
            document.getElementById('compareView').classList.add('hidden');
            document.getElementById('headerTitle').innerText = 'FOKO SYSTEM';
            
            invBtn.className = "px-3 py-1.5 rounded-lg text-xs font-semibold border transition-all bg-cyan-500/20 text-cyan-400 border-cyan-500/50 shadow-[0_0_10px_rgba(56,189,248,0.3)]";
            cmpBtn.className = "px-3 py-1.5 rounded-lg text-xs font-semibold border transition-all text-slate-400 border-transparent hover:text-cyan-400";
            render();
        } else {
            document.getElementById('inventoryView').classList.add('hidden');
            document.getElementById('compareView').classList.remove('hidden');
            document.getElementById('headerTitle').innerText = 'MARKET DATA';
            
            cmpBtn.className = "px-3 py-1.5 rounded-lg text-xs font-semibold border transition-all bg-cyan-500/20 text-cyan-400 border-cyan-500/50 shadow-[0_0_10px_rgba(56,189,248,0.3)]";
            invBtn.className = "px-3 py-1.5 rounded-lg text-xs font-semibold border transition-all text-slate-400 border-transparent hover:text-cyan-400";
            renderCompare();
        }
    };

    window.setCategory = function(cat) {
        state.currentCategory = cat;
        renderTabs();
        render();
    };

    function renderTabs() {
        const container = document.getElementById('categoryTabs');
        container.innerHTML = categories.map(cat => `
            <button onclick="window.setCategory('${cat}')" 
                class="px-5 py-2 text-sm font-medium whitespace-nowrap ${state.currentCategory === cat ? 'tab-active' : 'tab-inactive'}">
                ${cat}
            </button>
        `).join('');
    }

    window.updateQty = async function(id, change, event) {
        if(event) event.stopPropagation(); // ป้องกันการติด Event Double Click
        const item = state.items.find(i => i.id === id);
        if (!item) return;
        
        const newQty = Math.max(0, (item.qty || 0) + change);
        await updateDoc(doc(db, 'artifacts', appId, 'users', userId, 'inventory', id), { qty: newQty });
    };

    window.deleteProduct = async function(id, event) {
        if(event) event.stopPropagation(); // ป้องกันการติด Event Double Click
        const result = await Swal.fire({
            title: 'ยืนยันการลบ?',
            text: "คุณต้องการลบสินค้านี้ใช่หรือไม่",
            icon: 'warning',
            showCancelButton: true,
            confirmButtonColor: '#ef4444',
            cancelButtonColor: '#334155',
            confirmButtonText: 'ลบข้อมูล',
            cancelButtonText: 'ยกเลิก'
        });
        if(result.isConfirmed) {
            await deleteDoc(doc(db, 'artifacts', appId, 'users', userId, 'inventory', id));
        }
    };

    window.editProductModal = async function(id) {
        const item = state.items.find(i => i.id === id);
        if(!item) return;

        const { value: formValues } = await Swal.fire({
            title: 'แก้ไขสินค้า',
            html: `
                <input id="swal-edit-name" class="swal2-input mb-3" placeholder="ชื่อสินค้า" value="${item.name || ''}">
                <div class="text-center text-xs text-slate-400 mb-1">ลิงก์รูปภาพเดิม / วางลิงก์ใหม่</div>
                <input id="swal-edit-img-url" class="swal2-input mb-3" placeholder="วางลิงก์รูปภาพ (Base64/URL)" value="${item.image || ''}">
                <select id="swal-edit-cat" class="swal2-select mb-3">
                    ${categories.filter(c => c !== 'รวมสินค้าทั้งหมด').map(c => `<option value="${c}" ${item.category === c ? 'selected' : ''}>${c}</option>`).join('')}
                </select>
            `,
            focusConfirm: false,
            showCancelButton: true,
            confirmButtonText: 'บันทึกการแก้ไข',
            cancelButtonText: 'ยกเลิก',
            preConfirm: () => {
                const name = document.getElementById('swal-edit-name').value;
                if (!name) {
                    Swal.showValidationMessage('กรุณาใส่ชื่อสินค้า');
                    return false;
                }
                return {
                    name: name,
                    image: document.getElementById('swal-edit-img-url').value,
                    category: document.getElementById('swal-edit-cat').value
                }
            }
        });

        if (formValues) {
            try {
                await updateDoc(doc(db, 'artifacts', appId, 'users', userId, 'inventory', id), formValues);
                Swal.fire({ icon: 'success', title: 'สำเร็จ', text: 'อัปเดตข้อมูลเรียบร้อย', timer: 1500, showConfirmButton: false });
            } catch (error) {
                console.error(error);
                Swal.fire('ข้อผิดพลาด', 'ไม่สามารถบันทึกข้อมูลได้', 'error');
            }
        }
    };

    function render() {
        if (state.mode !== 'inventory') return;
        
        const filtered = state.currentCategory === "รวมสินค้าทั้งหมด" 
            ? state.items 
            : state.items.filter(i => i.category === state.currentCategory);

        const container = document.getElementById('itemGrid');
        container.innerHTML = filtered.map(item => {
            const isLow = item.qty <= 5;
            const bgImage = item.image && item.image.trim() !== '' ? item.image : 'https://via.placeholder.com/300x300/1e293b/94a3b8?text=No+Image';
            return `
            <div class="item-card rounded-2xl overflow-hidden h-48 flex flex-col justify-end ${isLow ? 'low-stock' : ''}" style="background-image: url('${bgImage}')" ondblclick="window.editProductModal('${item.id}')">
                <button onclick="window.deleteProduct('${item.id}', event)" class="absolute top-2 right-2 text-red-400/80 hover:text-red-500 bg-slate-900/60 rounded-full w-8 h-8 flex items-center justify-center z-20 backdrop-blur-sm transition-all border border-red-500/30 hover:bg-red-500/20">
                    <i class="fas fa-trash text-xs"></i>
                </button>
                <div class="item-overlay absolute inset-0"></div>
                <div class="relative z-10 p-3 w-full">
                    <h3 class="font-semibold text-white text-sm mb-1 truncate drop-shadow-md">${item.name}</h3>
                    <div class="flex items-center justify-between mt-2">
                        <button onclick="window.updateQty('${item.id}', -1, event)" class="w-8 h-8 rounded-full qty-btn flex items-center justify-center">
                            <i class="fas fa-minus text-xs"></i>
                        </button>
                        <div class="text-center px-2" onclick="(e) => e.stopPropagation()">
                            <span class="text-2xl font-bold ${isLow ? 'text-red-400' : 'text-cyan-400'} drop-shadow-lg">${item.qty || 0}</span>
                        </div>
                        <button onclick="window.updateQty('${item.id}', 1, event)" class="w-8 h-8 rounded-full qty-btn flex items-center justify-center">
                            <i class="fas fa-plus text-xs"></i>
                        </button>
                    </div>
                </div>
            </div>
        `}).join('');
    }

    function renderCompare() {
        const container = document.getElementById('compareGrid');
        
        // 1. จัดกลุ่มข้อมูลตามชื่อสินค้า
        const groupedData = {};
        state.compareItems.forEach(item => {
            // รองรับโครงสร้างเก่าที่มีแค่ name ด้วย เพื่อไม่ให้ของเก่าบัค
            const pName = item.productName || item.name || 'สินค้าไม่ได้ระบุชื่อ'; 
            if (!groupedData[pName]) {
                groupedData[pName] = [];
            }
            groupedData[pName].push(item);
        });

        // 2. สร้าง HTML สำหรับแต่ละกลุ่มสินค้า
        let html = '';
        for (const [productName, stores] of Object.entries(groupedData)) {
            // เรียงลำดับราคาร้านค้าจากน้อยไปมาก
            stores.sort((a, b) => (parseFloat(a.price) || 0) - (parseFloat(b.price) || 0));

            let storeHtml = stores.map((store, index) => {
                // ให้ร้านที่ราคาต่ำที่สุด (index 0) มีไฮไลท์สีพิเศษ
                const isBestPrice = index === 0 && stores.length > 1; 
                return `
                    <div class="glass-panel p-4 rounded-2xl relative group ${isBestPrice ? 'border-green-400/50 shadow-[0_0_15px_rgba(74,222,128,0.2)]' : ''}">
                        ${isBestPrice ? '<div class="absolute -top-3 -left-2 bg-green-500 text-white text-[10px] font-bold px-2 py-1 rounded-full shadow-lg z-10">ถูกที่สุด ⭐</div>' : ''}
                        <button onclick="window.deleteCompareItem('${store.id}')" class="absolute top-3 right-3 text-red-400/70 hover:text-red-400 transition-colors">
                            <i class="fas fa-trash"></i>
                        </button>
                        <h3 class="font-bold text-cyan-400 mb-2 pr-6">${store.storeName || store.name || 'ไม่ระบุร้าน'}</h3>
                        <p class="text-sm text-slate-300">ราคา: <span class="${isBestPrice ? 'text-green-400' : 'text-white'} font-semibold text-lg">${store.price || 0}</span> บาท</p>
                    </div>
                `;
            }).join('');

            html += `
                <div class="w-full bg-slate-900/50 p-4 rounded-3xl border border-slate-700/50 mb-2">
                    <h2 class="text-xl font-bold text-white mb-4 border-b border-slate-700 pb-2"><i class="fas fa-box text-cyan-500 mr-2"></i>${productName}</h2>
                    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                        ${storeHtml}
                    </div>
                </div>
            `;
        }

        container.innerHTML = html || '<p class="text-center text-slate-400 mt-10">ยังไม่มีข้อมูลเปรียบเทียบราคา</p>';
    }

    window.deleteCompareItem = async function(id) {
        const result = await Swal.fire({
            title: 'ยืนยันการลบ?',
            text: "คุณต้องการลบข้อมูลร้านค้านี้ใช่หรือไม่",
            icon: 'warning',
            showCancelButton: true,
            confirmButtonColor: '#ef4444',
            cancelButtonColor: '#334155',
            confirmButtonText: 'ลบข้อมูล',
            cancelButtonText: 'ยกเลิก'
        });
        if(result.isConfirmed) {
            await deleteDoc(doc(db, 'artifacts', appId, 'users', userId, 'compare', id));
        }
    };

    window.handleFabClick = function() {
        if (state.mode === 'inventory') {
            window.addNewProductModal();
        } else {
            window.addCompareModal();
        }
    };

    window.addCompareModal = async function() {
        const { value: formValues } = await Swal.fire({
            title: 'เพิ่มข้อมูลร้านค้า/ราคา',
            html: `
                <input id="swal-compare-pname" class="swal2-input mb-3" placeholder="ชื่อสินค้า (เช่น แม็คโคร, น้ำตาลมิตรผล)">
                <input id="swal-compare-sname" class="swal2-input mb-3" placeholder="ชื่อร้านค้าที่ไปสำรวจ">
                <input id="swal-compare-price" type="number" class="swal2-input mb-3" placeholder="ราคา (บาท)">
            `,
            focusConfirm: false,
            showCancelButton: true,
            confirmButtonText: 'บันทึก',
            cancelButtonText: 'ยกเลิก',
            preConfirm: () => {
                const pname = document.getElementById('swal-compare-pname').value;
                const sname = document.getElementById('swal-compare-sname').value;
                const price = document.getElementById('swal-compare-price').value;
                
                if (!pname || !sname) {
                    Swal.showValidationMessage('กรุณาใส่ชื่อสินค้าและชื่อร้านค้าให้ครบ');
                    return false;
                }
                return { 
                    productName: pname, 
                    storeName: sname, 
                    price: parseFloat(price) || 0 
                }
            }
        });

        if (formValues) {
            try {
                await addDoc(collection(db, 'artifacts', appId, 'users', userId, 'compare'), formValues);
                Swal.fire({ icon: 'success', title: 'สำเร็จ', text: 'เพิ่มข้อมูลเรียบร้อยแล้ว', timer: 1500, showConfirmButton: false });
            } catch (error) {
                console.error(error);
                Swal.fire('ข้อผิดพลาด', 'ไม่สามารถบันทึกข้อมูลได้', 'error');
            }
        }
    };

    window.addNewProductModal = async function() {
        const { value: formValues } = await Swal.fire({
            title: 'เพิ่มรายการใหม่',
            html: `
                <input id="swal-name" class="swal2-input mb-3" placeholder="ชื่อสินค้า">
                
                <div class="text-left px-5 mb-1">
                    <label class="text-sm text-slate-300 block mb-2">อัปโหลดรูปภาพสินค้า (โหลดไวทันที):</label>
                    <input type="file" id="swal-img-file" class="w-full text-sm text-slate-300 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-sm file:font-semibold file:bg-cyan-500/20 file:text-cyan-400 hover:file:bg-cyan-500/30 cursor-pointer" accept="image/*">
                </div>
                
                <div class="text-center text-xs text-slate-400 mb-1">- หรือ -</div>
                <input id="swal-img-url" class="swal2-input mb-3" placeholder="วางลิงก์รูปภาพ (ถ้ามี)">

                <input id="swal-qty" type="number" class="swal2-input mb-3" placeholder="จำนวนเริ่มต้น" value="1">
                <select id="swal-cat" class="swal2-select">
                    ${categories.filter(c => c !== 'รวมสินค้าทั้งหมด').map(c => `<option value="${c}">${c}</option>`).join('')}
                </select>
            `,
            focusConfirm: false,
            showCancelButton: true,
            confirmButtonText: 'บันทึก',
            cancelButtonText: 'ยกเลิก',
            preConfirm: async () => {
                const name = document.getElementById('swal-name').value;
                if (!name) {
                    Swal.showValidationMessage('กรุณาใส่ชื่อสินค้า');
                    return false;
                }

                const fileInput = document.getElementById('swal-img-file');
                const file = fileInput.files[0];
                const urlInput = document.getElementById('swal-img-url').value;
                let imageUrl = urlInput || ""; 

                if (file) {
                    Swal.showLoading();
                    try {
                        imageUrl = await new Promise((resolve, reject) => {
                            const reader = new FileReader();
                            reader.onload = (e) => {
                                const img = new Image();
                                img.onload = () => {
                                    const canvas = document.createElement('canvas');
                                    const MAX_SIZE = 300; 
                                    let width = img.width;
                                    let height = img.height;
                                    
                                    if (width > height) {
                                        if (width > MAX_SIZE) { height *= MAX_SIZE / width; width = MAX_SIZE; }
                                    } else {
                                        if (height > MAX_SIZE) { width *= MAX_SIZE / height; height = MAX_SIZE; }
                                    }
                                    
                                    canvas.width = width;
                                    canvas.height = height;
                                    const ctx = canvas.getContext('2d');
                                    ctx.drawImage(img, 0, 0, width, height);
                                    resolve(canvas.toDataURL('image/jpeg', 0.7)); 
                                };
                                img.onerror = reject;
                                img.src = e.target.result;
                            };
                            reader.onerror = reject;
                            reader.readAsDataURL(file);
                        });
                    } catch (error) {
                        Swal.showValidationMessage('ประมวลผลรูปภาพไม่สำเร็จ');
                        return false;
                    }
                }

                return {
                    name: name,
                    image: imageUrl,
                    qty: parseInt(document.getElementById('swal-qty').value) || 0,
                    category: document.getElementById('swal-cat').value
                }
            }
        });

        if (formValues) {
            try {
                await addDoc(collection(db, 'artifacts', appId, 'users', userId, 'inventory'), formValues);
                Swal.fire({ icon: 'success', title: 'สำเร็จ', text: 'เพิ่มสินค้าเรียบร้อยแล้ว', timer: 1500, showConfirmButton: false });
            } catch (error) {
                console.error(error);
                Swal.fire('ข้อผิดพลาด', 'ไม่สามารถบันทึกข้อมูลได้', 'error');
            }
        }
    };

    init();
</script>
</body>
</html>
